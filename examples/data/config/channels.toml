# Commits not pushed (D78): one count per repository, "no remote" when a branch has no
# upstream. Without `repos`, every project in projects.toml is watched.
[[channel]]
id = "unpushed"
title = "Commits not pushed"
label = "source"
why = "git itself: the commits on each branch that its upstream does not have"
reader = "git_unpushed"

[[channel]]
id = "queue_view"
title = "Generated view of the queue"
label = "copy"
why = "generated from queue.json"
path = "~/projects/example/QUEUE.md"

[[channel]]
id = "old_list"
title = "Old tracking list"
label = "dead"
why = "replaced by the queue; its rows were moved there"
path = "~/projects/example/OLD_LIST.md"
